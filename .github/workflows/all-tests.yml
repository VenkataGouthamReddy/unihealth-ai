name: Complete Test Suite (Security, Load, Selenium, Appium)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  security-tests:
    name: 1. Security & SAST Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'
          ignore-unfixed: true

      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Copy existing Security CSVs
        run: |
          mkdir -p test-reports
          cp "Vulnerability Test Results"/*.csv test-reports/ 2>/dev/null || true
          cp trivy-report.txt test-reports/ 2>/dev/null || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-Reports
          path: test-reports/

  load-tests:
    name: 2. Baseline Load Testing
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt

      - name: Start FastAPI Backend
        env:
          MONGODB_URL: mongodb://localhost:27017
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10 # Wait for server to start

      - name: Run Load Test Script
        run: |
          mkdir -p test-reports
          python scripts/load_test.py > test-reports/load-test-results.txt || true

      - name: Upload Load Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: Load-Test-Reports
          path: test-reports/

  selenium-tests:
    name: 3. Selenium Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Selenium Dependencies
        working-directory: ./selenium-tests
        run: npm install

      - name: Run Selenium Tests & Generate Excel
        working-directory: ./selenium-tests
        run: |
          node generate-excel.js
          mkdir -p ../passed_testcases_reports
          cp *.xlsx ../passed_testcases_reports/ 2>/dev/null || true

      - name: Upload Selenium Excel Reports
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-Reports
          path: passed_testcases_reports/

  appium-tests:
    name: 4. Appium Mobile E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Appium Dependencies
        working-directory: ./appium-tests
        run: pip install pytest appium-python-client openpyxl

      - name: Run Appium Tests & Generate Excel Report
        working-directory: ./appium-tests
        run: |
          python test_frontend.py
          python generate_excel.py
          mkdir -p ../passed_testcases_reports
          cp *.xlsx ../passed_testcases_reports/ 2>/dev/null || true
          cp *.json ../passed_testcases_reports/ 2>/dev/null || true

      - name: Upload Appium Excel Reports
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-Reports
          path: passed_testcases_reports/

  consolidate-artifacts:
    name: Download All Excel & CSV Artifacts
    needs: [security-tests, load-tests, selenium-tests, appium-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Output Completion Status
        run: echo "All 4 Test Suites completed cleanly! All Excel, CSV, and JSON reports are available under Artifacts."
