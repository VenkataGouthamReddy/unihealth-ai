name: Security Review
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Detect Backend Language
        run: |
          if [ -f "requirements.txt" ]; then
            echo "Language: Python (FastAPI/Flask/Django detected)"
            echo "LANGUAGE=python" >> $GITHUB_ENV
          elif [ -f "package.json" ]; then
            echo "Language: Node.js detected"
            echo "LANGUAGE=node" >> $GITHUB_ENV
          else
            echo "Language: Unknown"
            echo "LANGUAGE=unknown" >> $GITHUB_ENV
          fi

      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Do not fail immediately, review findings later

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL' # Fails only if Critical findings are detected

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1"
        continue-on-error: true # Allow SARIF upload even if Semgrep finds issues

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: Generate Vulnerability Reports (Placeholder)
        run: |
          mkdir -p "Vulnerability Test Results"
          echo "Automated Security Scan Completed." > "Vulnerability Test Results/scan-summary.txt"
          
      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: Vulnerability Test Results/
