name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Add MongoDB Service
    services:
      mongodb:
        image: mongo:latest
        ports:
          - "27017:27017"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Environment Variables
      run: |
        echo "MONGODB_URL=mongodb://localhost:27017" > .env
        echo "DATABASE_NAME=unihealth" >> .env
        echo "SECRET_KEY=ci_test_secret_key" >> .env

    - name: Seed Test User in MongoDB
      run: |
        python -c "import asyncio; from motor.motor_asyncio import AsyncIOMotorClient; from core.security import get_password_hash; client = AsyncIOMotorClient('mongodb://localhost:27017'); db = client['unihealth']; user = {'email': 'gouthamgogireddy@gmail.com', 'hashed_password': get_password_hash('Goutham@19'), 'role': 'student', 'name': 'Goutham Test'}; asyncio.get_event_loop().run_until_complete(db.users.insert_one(user)); print('Database seeded with test user!')"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: npm install

    - name: Run servers and test
      run: |
        # Start backend in the background
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
        
        # Start frontend in the background
        npm run dev:frontend -- --host 127.0.0.1 > frontend.log 2>&1 &
        
        # Wait up to 120 seconds for both services to be responsive
        if ! npx wait-on http://127.0.0.1:5173 http://127.0.0.1:8000/docs -t 120000; then
          echo "==== WAIT-ON FAILED ===="
          echo "==== BACKEND LOGS ===="
          cat backend.log || true
          echo "==== FRONTEND LOGS ===="
          cat frontend.log || true
          exit 1
        fi
        
        # Run Selenium Tests
        cd selenium-tests
        npm install
        if ! node tests/login-tests.js; then
          echo "==== BACKEND LOGS ===="
          cat ../backend.log || true
          echo "==== FRONTEND LOGS ===="
          cat ../frontend.log || true
          exit 1
        fi
      env:
        CI: true

    - name: Generate Excel Artifact
      if: always()
      working-directory: ./selenium-tests
      run: |
        npm install
        node generate-excel.js

    - name: Upload Excel Test Matrix
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: UniHealthAI_Login_Test_Cases
        path: selenium-tests/UniHealthAI_Login_Test_Cases.xlsx
