name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Environment Variables
      run: |
        # Create a dummy .env file for the CI environment if needed
        # Feel free to replace these with GitHub Secrets for production
        echo "DATABASE_URL=sqlite:///./unihealth.db" > .env
        echo "JWT_SECRET_KEY=ci_test_secret_key" >> .env

    - name: Start backend server
      run: |
        # Using nohup to ensure the process stays alive in the background
        nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        echo "Backend server started in background."

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: npm install

    - name: Start frontend server
      run: |
        # Start Vite dev server in background
        nohup npm run dev > frontend.log 2>&1 &
        echo "Frontend server started in background."

    - name: Wait for services to boot
      run: |
        # Wait up to 30 seconds for both services to be responsive
        npx wait-on http://localhost:5173 http://localhost:8000/docs -t 30000

    - name: Run Selenium Tests
      working-directory: ./selenium-tests
      run: |
        npm install
        node tests/login-tests.js
      env:
        CI: true

    - name: Generate Excel Artifact
      if: always()
      working-directory: ./selenium-tests
      run: node generate-excel.js

    - name: Upload Excel Test Matrix
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: UniHealthAI_Login_Test_Cases
        path: selenium-tests/UniHealthAI_Login_Test_Cases.xlsx
