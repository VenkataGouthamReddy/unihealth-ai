name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Add MongoDB Service
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Environment Variables
      run: |
        echo "MONGODB_URL=mongodb://localhost:27017" > .env
        echo "DATABASE_NAME=unihealth" >> .env
        echo "SECRET_KEY=ci_test_secret_key" >> .env

    - name: Seed Test User in MongoDB
      run: |
        python -c '
import asyncio
from motor.motor_asyncio import AsyncIOMotorClient
from core.security import get_password_hash

async def seed():
    client = AsyncIOMotorClient("mongodb://localhost:27017")
    db = client["unihealth"]
    await db.users.insert_one({
        "email": "gouthamgogireddy@gmail.com",
        "hashed_password": get_password_hash("Goutham@19"),
        "role": "student",
        "name": "Goutham Test"
    })
    print("Database seeded with test user!")
asyncio.run(seed())
        '

    - name: Start backend server
      run: |
        nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        echo "Backend server started in background."

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: npm install

    - name: Start frontend server
      run: |
        nohup npm run dev > frontend.log 2>&1 &
        echo "Frontend server started in background."

    - name: Wait for services to boot
      run: |
        npx wait-on http://localhost:5173 http://localhost:8000/docs -t 30000

    - name: Run Selenium Tests
      working-directory: ./selenium-tests
      run: |
        npm install
        node tests/login-tests.js
      env:
        CI: true

    - name: Generate Excel Artifact
      if: always()
      working-directory: ./selenium-tests
      run: node generate-excel.js

    - name: Upload Excel Test Matrix
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: UniHealthAI_Login_Test_Cases
        path: selenium-tests/UniHealthAI_Login_Test_Cases.xlsx
